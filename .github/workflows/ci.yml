name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    # Pushes to a branch with an open pull request would otherwise run twice.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xbo
          POSTGRES_USER: xbo
          POSTGRES_PASSWORD: xbo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xbo -d xbo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      XBO_DATABASE_URL: postgres://xbo:xbo@localhost:5432/xbo
      XBO_TEST_DATABASE_URL: postgres://xbo:xbo@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @xbo/contracts build

      - run: pnpm typecheck

      - run: pnpm lint

      - name: Check migrations match the schema
        run: |
          pnpm --filter @xbo/api db:check
          pnpm --filter @xbo/api db:generate
          test -z "$(git status --porcelain apps/api/drizzle)"

      - name: Apply migrations to an empty database
        run: pnpm --filter @xbo/api db:migrate

      - run: pnpm test

      - run: pnpm build
