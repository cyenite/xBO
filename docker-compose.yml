services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xbo
      POSTGRES_USER: xbo
      POSTGRES_PASSWORD: xbo
    ports:
      - "${XBO_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xbo -d xbo"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${XBO_REDIS_PORT:-6380}:6379"

volumes:
  postgres-data:
