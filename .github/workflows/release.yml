name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Publishing needs the npm org and token; until they exist the workflow only opens the version pull request.
      - name: Check for an npm token
        id: npm
        run: echo "has-token=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: ${{ steps.npm.outputs.has-token == 'true' && 'pnpm release' || '' }}
          title: Release packages
          commit: Release packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
